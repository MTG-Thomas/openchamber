name: Fork upstream intake
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: fork-upstream-intake
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'mtg-thomas/openchamber'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Prepare integration PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fork/upstream-sync.mjs
